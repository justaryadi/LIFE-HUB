<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Focus | LIFEHUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

    <nav class="feature-navbar">
        <div class="nav-pill">
            <a href="dashboard.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
            <a href="quest.html"><i data-lucide="check-square"></i><span>Quest</span></a>
            <a href="habit.html"><i data-lucide="repeat"></i><span>Habit</span></a>
            <a href="pomodoro.html" class="active"><i data-lucide="timer"></i><span>Pomodoro</span></a>
            <a href="achievement.html"><i data-lucide="award"></i><span>Achievement</span></a>
            <a href="eco.html"><i data-lucide="leaf"></i><span>Eco</span></a>
        </div>
    </nav>

    <main class="page-shell">

        <header class="page-header mb-12">
            <p class="text-xl eyebrow">Feature</p>
            <h1 class="text-4xl md:text-5xl font-family:'Inter',sans-serif font-bold text-[#0f172a] tracking-tight leading-tight mb-4">Pomodoro Focus</h1>
            <p class="text-slate-500 text-lg ">Protect your deep work time with structured focus sessions.</p>
        </header>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-5xl mx-auto w-full">

            <div class="feature-panel w-full text-center">
                <p class="panel-label">Session 01</p>
                <h2>Standard Focus</h2>
                
                <div class="flex bg-gray-50 border border-emerald-100 p-1 rounded-xl max-w-xs mx-auto mb-6">
                    <button class="mode-btn active flex-1 py-2 text-sm font-medium rounded-lg transition-all" id="focusBtn">Focus</button>
                    <button class="mode-btn flex-1 py-2 text-sm font-medium rounded-lg transition-all" id="breakBtn">Break</button>
                </div>

                <div class="timer-display">
                    <div class="timer-inner">
                        <h2 id="pomodoroTime">25:00</h2>
                        <p id="pomodoroStatus">Ready to focus</p>
                    </div>
                </div>

                <div class="flex justify-center gap-4 mt-6">
                    <button class="primary-btn" id="startBtn">Start</button>
                    <button class="secondary-btn" id="pauseBtn">Pause</button>
                    <button class="secondary-btn" id="resetBtn">Reset</button>
                </div>
            </div>

            <div class="feature-panel w-full text-center">
                <p class="panel-label">Session 02</p>
                <h2>Extended Focus</h2>
                
                <div class="flex bg-gray-50 border border-emerald-100 p-1 rounded-xl max-w-xs mx-auto mb-6">
                    <button class="mode-btn active flex-1 py-2 text-sm font-medium rounded-lg transition-all" id="focusBtnExt">Focus</button>
                    <button class="mode-btn flex-1 py-2 text-sm font-medium rounded-lg transition-all" id="breakBtnExt">Break</button>
                </div>

                <div class="timer-display">
                    <div class="timer-inner">
                        <h2 id="pomodoroTimeExt">50:00</h2>
                        <p id="pomodoroStatusExt">Ready to focus</p>
                    </div>
                </div>

                <div class="flex justify-center gap-4 mt-6">
                    <button class="primary-btn" id="startBtnExt">Start</button>
                    <button class="secondary-btn" id="pauseBtnExt">Pause</button>
                    <button class="secondary-btn" id="resetBtnExt">Reset</button>
                </div>
            </div>

        </section>

    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/lifehub-core.js"></script>
    <script src="../js/pomodoro-page.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
